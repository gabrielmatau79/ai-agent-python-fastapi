name: Release Tag

# After a PR carrying a version-bump.yml commit is merged, tag the resulting
# main commit with the version now in pyproject.toml and publish a GitHub
# Release. Tags aren't covered by main's branch protection, so this can push
# directly with no bypass configuration needed.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read current version
        id: version
        run: |
          VERSION=$(python -c "
          from pathlib import Path
          from scripts.bump_version import read_current_version
          print(read_current_version(Path('pyproject.toml')))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" --generate-notes
