[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-python-fastapi"
version = "0.2.0"
description = "Python FastAPI project with RAG, session memory, MCP, and multi-LLM support."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Gabriel Mata" }
]
dependencies = [
  "anthropic>=0.52.2",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "jinja2>=3.1.0",
  "langchain-anthropic>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-ollama>=0.3.0",
  "langchain-openai>=0.3.0",
  "mcp>=1.9.0,<2.0.0",
  "openai>=1.82.0",
  "pydantic-settings>=2.8.0",
  "pypdf>=5.4.0",
  "python-multipart>=0.0.9",
  "redis[hiredis]>=6.0.0",
  "structlog>=25.4.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.26.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["app"]
